
name: Publish selected Qiita article

on:
  workflow_dispatch:
    inputs:
      article:
        description: "公開する記事のファイル名（.mdなし）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: qiita-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate article
        env:
          ARTICLE: ${{ inputs.article }}
        run: |
          if [[ ! "$ARTICLE" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "Invalid article name"
            exit 1
          fi

          if [[ ! -f "public/$ARTICLE.md" ]]; then
            echo "Article not found"
            exit 1
          fi

      - name: Publish selected article
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
          ARTICLE: ${{ inputs.article }}
        run: npx qiita publish "$ARTICLE"

      - name: Save article metadata
        env:
          ARTICLE: ${{ inputs.article }}
        run: |
          git add "public/$ARTICLE.md"

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Qiita metadata: $ARTICLE"
            git push
          fi
